name: LaTeX Build
on:
  push:
    branches: [ ai4-build ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main_tex_con.tex
          latexmk_use_xelatex: true
      - uses: actions/upload-artifact@v4
        with:
          name: qr-v6-pdf
          path: ./*.pdf
