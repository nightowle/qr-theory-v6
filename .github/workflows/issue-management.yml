name: Research Issue Management
on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, closed]

jobs:
  organize-research:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-label Issues
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.BLUE_QR_AUTOMATION }}
          script: |
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            
            let labels = [];
            if (title.includes('bao') || title.includes('acoustic')) {
              labels.push('physics:cosmology');
            }
            if (title.includes('rotation') || title.includes('galaxy')) {
              labels.push('physics:galactic');
            }
            if (title.includes('string') || title.includes('topological')) {
              labels.push('theory:strings');
            }
            if (title.includes('validation') || title.includes('empirical')) {
              labels.push('validation');
            }
            
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels
              });
            }
