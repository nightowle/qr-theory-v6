name: Build QR Theory LaTeX Document

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-latex:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install TecLive (full)
        run: sudo apt-get update && sudo apt-get install -y texlive-full latexmk

      - name: Compile LaTex
        run: latexmk -pdf -interaction=nonstopmode -nofail -halt-on-error main_tex_con.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: qr-theory-v6.00-pdf
          path: main_tex_con.pdf
          retention-days: 30

      - name: Upload Logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-build-logs
          path: |
            *.log
            *.aux
            *.fls
            *.fdb_latexmk
          retention-days: 7