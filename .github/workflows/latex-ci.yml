name: Build QR Theory LaTeX Document

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-latex:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.BLUE_QR_AUTOMATION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup TeX Live
        uses: teatimeguest/setup-texlive-action@v3
        with:
          packages: >-
            latexmk texlive-latex-recommended texlive-latex-extra
            texlive-fonts-recommended texlive-science texlive-bibtex-extra

      - name: Build PDF
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Check PDF generation
        run: |
          if [ -f "main.pdf" ]; then
            echo "✅ PDF successfully generated"
            ls -lh main.pdf
            file main.pdf
          else
            echo "❌ PDF generation failed"
            exit 1
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: qr-theory-v6.00-pdf
          path: main.pdf
          retention-days: 30

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-build-logs
          path: |
            *.log
            *.aux
            *.blg
            *.fls
            *.fdb_latexmk
          retention-days: 7

