name: Build QR Theory LaTeX Document

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-latex:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install TexLive
      run: sudo apt-get update && sudo apt-get install -y \
          texlive-latex-base texlive-latex-recommended \
          texlive-latex-extra texlive-fonts-recommended \
          texlive-science latexmk

    - name: Compile LaTeX
      run: |
        latexmk -pdf -interaction=nonstopmode -halt-on-error main_tex_con.tex
        mv main_tex_con.pdf main.pdf
        ls -lh main.pdf

    - name: Upload PDF Artifact
      uses: actions/upload-artifact@v4
      with:
        name: qr-theory-v6.00-pdf
        path: main.pdf
        retention-days: 30

    - name: Upload Logs (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: latex-build-logs
        path: |
          *.log
          *.aux
          *.blg
          *.fls
          *.fdb_latexmk
        retention-days: 7