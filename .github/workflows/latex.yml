name: Build QR Theory LaTeX Document

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-latex:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup LaTeX
      uses: xu-cheng/latex-action@v3
      with:
        root_file: main.tex
        latexmk_shell_escape: true
        latexmk_use_lualatex: false
        latexmk_use_xelatex: false
        extra_packages: |
          amsmath amssymb amsthm mathtools physics
          graphicx booktabs array multirow float
          caption subcaption siunitx xcolor
          hyperref cleveref biblatex microtype
          csquotes geometry fancyhdr tensor
          slashed algorithm algorithmic listings
          todonotes silence
        pre_compile: |
          mkdir -p figures
          mkdir -p chapters  
          mkdir -p appendices
          mkdir -p bibliography
        post_compile: |
          ls -la *.pdf
          
    - name: Check PDF generation
      run: |
        if [ -f "main.pdf" ]; then
          echo "✅ PDF successfully generated"
          ls -lh main.pdf
          file main.pdf
        else
          echo "❌ PDF generation failed"
          exit 1
        fi
        
    - name: Upload PDF artifact
      uses: actions/upload-artifact@v4
      with:
        name: qr-theory-v6.00-pdf
        path: main.pdf
        retention-days: 30
        
    - name: Upload build logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: latex-build-logs
        path: |
          *.log
          *.aux
          *.blg
          *.fls
          *.fdb_latexmk
        retention-days: 7
