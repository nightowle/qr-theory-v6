name: Deploy LaTeX PDF
-on:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install LaTex
        run: sudo apt-get install -qu -m latexmk texlive
      - name: Compile Main
        run: latexmk -pdf main_tex_con.tex
      - name: Deploy to GHP
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true