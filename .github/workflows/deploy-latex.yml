name: Deploy LaTeX PDF

on:
  push:
    brances: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-m22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install TecLive (full)
        run: sudo apt-get update && sudo apt-get install -y texlive-full latexmk

      - name: Compile main document
        run: latexmk -pdf -interaction=nonstopmode -nofail -halt-on-error main_tex_con.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: qr-theory-v6.00-pdf
          path: main_tex_con.pdf
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latex-logs
          path: |
            *.log
            *.aux
            *.fls
            *.fdb_latexmk
          retention-days: 7

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true